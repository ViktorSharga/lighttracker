services:
  lighttracker:
    build: .
    # Puppeteer's Chrome has no linux-arm64 build; match Railway (amd64) on Apple Silicon
    platform: linux/amd64
    container_name: lighttracker
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - FETCH_INTERVAL_MS=300000
      - SOURCE_URL=https://poweron.loe.lviv.ua/
    restart: unless-stopped
